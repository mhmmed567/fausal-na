[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/authorize"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/token"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/register"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/revoke"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/.well-known/*"
  to = "/.netlify/functions/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
